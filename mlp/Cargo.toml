[package]
name = "emg_burn_classifier"
version = "0.1.0"
edition = "2021"

[dependencies]
burn = { version = "0.16", features = ["train", "wgpu", "autodiff"] }
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = { version = "0.8", features = ["std"] }
serialport = "4.3" # 시리얼 통신 크레이트 추가
