[package]
name = "emg_ml_pipeline"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "emg_client"
path = "src/main.rs"

[[bin]]
name = "emg_server"
path = "src/bin/server.rs"

[dependencies]
burn = { version = "0.14", features = ["std", "wgpu", "train", "dataset", "autodiff"] }
burn-wgpu = "0.14"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
glob = "0.3"
serialport = "4.2"
chrono = "0.4.45"
rustfft = "6.2"
num-complex = "0.4"
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
reqwest = { version = "0.12", features = ["blocking", "multipart", "json", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
